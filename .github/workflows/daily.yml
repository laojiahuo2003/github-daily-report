name: GitHub Daily Report

on:
  schedule:
    - cron: '0 1 * * *'   # 中国时间 09:00
    - cron: '0 10 * * *'  # 中国时间 18:00
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      
      - name: Delete old reports (2 months ago)
        run: |
          find reports/ -name "*.md" -type f -mtime +60 -delete || true
          find reports/ -name "*.json" -type f -mtime +60 -delete || true
          echo "Deleted reports older than 60 days"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run daily report
        env:
          MY_GITHUB_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
        run: python main.py

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/ feed.xml feed.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Add daily report $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
          git stash
          git pull --rebase
          git stash pop || true
          git push

      - name: Purge jsdelivr CDN cache
        run: |
          sleep 5
          curl -sf "https://purge.jsdelivr.net/gh/laojiahuo2003/github-daily-report@main/feed.xml" || true
          curl -sf "https://purge.jsdelivr.net/gh/laojiahuo2003/github-daily-report@main/feed.json" || true
