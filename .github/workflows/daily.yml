name: GitHub Daily Report

on:
  schedule:
    - cron: '0 1 * * *'   # 中国时间 09:00
    - cron: '0 10 * * *'  # 中国时间 18:00
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
      
      - name: Delete old reports (2 months ago)
        run: |
          find reports/ -name "*.md" -type f -mtime +60 -delete || true
          echo "Deleted reports older than 60 days"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run daily report
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py
      
      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/
          git diff --quiet && git diff --staged --quiet || git commit -m "Add daily report $(date +'%Y-%m-%d')"
          git push
